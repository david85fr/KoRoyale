<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d1b2a">
<meta name="description" content="KoRoyale — un battle royale de chèvres sur le circuit de Monaco. Salons privés, coffres, armes, voitures, jouable au clavier, à la manette et sur téléphone.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>KoRoyale — Battle Royale de Chèvres à Monaco</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%90%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/css/style.css">
<script type="importmap">
{
  "imports": {
    "three": "/vendor/three.module.js"
  }
}
</script>
</head>
<body data-screen="connecting">

  <canvas id="scene"></canvas>

  <!-- Interface hors partie : menu, salon, résultats -->
  <div id="ui"></div>

  <!-- Interface en partie -->
  <div id="hud" hidden></div>

  <!-- Contrôles tactiles (injectés par InputManager) -->
  <div id="touch" hidden></div>

  <noscript>
    <div class="noscript">
      <h1>KoRoyale</h1>
      <p>Ce jeu a besoin de JavaScript. Activez-le pour rejoindre le troupeau.</p>
    </div>
  </noscript>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
